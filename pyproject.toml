[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dirdiff"
version = "0.1.0"
description = "Standalone browser diff viewer for real-world files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-clojure",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-json>=0.24.8",
    "tree-sitter-markdown>=0.5.1",
    "tree-sitter-ocaml>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-toml>=0.7.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-yaml>=0.7.2",
    "uvicorn>=0.49.0",
    "watchfiles>=1.2.0",
]

[project.scripts]
dirdiff = "dirdiff.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.3.0",
    "mypy>=2.1.0",
    "pytest>=8.0",
    "ruff>=0.15.17",
    "syrupy>=5.3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dirdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not git"]
markers = ["git: tests that create real git repositories or shell out to git"]

[tool.mypy]
exclude = ["tests/presets/"]

[tool.uv.sources]
tree-sitter-clojure = { git = "ssh://git@github.com/juliancoffeelab/tree-sitter-clojure-py.git", rev = "main" }
