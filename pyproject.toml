[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dirdiff"
version = "0.1.0"
description = "Standalone whole-file diff viewer for generic text files"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
dirdiff = "dirdiff.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dirdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
