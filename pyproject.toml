[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-diff-viewer"
version = "0.1.0"
description = "Standalone whole-file diff viewer for generic text files"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
file-diff-viewer = "file_diff_viewer.app:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
file_diff_viewer = ["static/*.css", "static/*.js", "templates/*.html"]
