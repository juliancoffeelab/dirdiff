<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dirdiff</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="page-shell">
        <header class="page-header">
            <div>
                <p class="eyebrow">Standalone Tool</p>
                <h1>dirdiff</h1>
                <p class="subtitle">
                    Compare generic UTF-8 text files across Git sides or directly by path.
                </p>
            </div>
            <div class="summary-card">
                <div class="summary-grid" id="summaryGrid"></div>
            </div>
        </header>

        <section class="controls">
            <form id="controlsForm">
                <label class="field-mode">
                    View
                    <select id="modeSelect" name="mode">
                        <option value="files">Diff files</option>
                        <option value="staged">Diff staged</option>
                        <option value="against-head">Diff against HEAD</option>
                        <option value="refs">Compare refs</option>
                    </select>
                    <span class="field-hint">HEAD means the commit you currently have checked out.</span>
                </label>
                <label class="field-path">
                    Only this path
                    <input id="pathInput" name="path" type="text" spellcheck="false" placeholder="src/app.py">
                    <span class="field-hint">Leave this empty to diff the whole repo.</span>
                </label>
                <div class="custom-refs" id="customRefsGroup" hidden>
                    <label class="field-left-ref">
                        Left ref
                        <input
                            id="leftRefInput"
                            name="leftRef"
                            type="text"
                            value=""
                            placeholder="main / origin/main / HEAD~1"
                            spellcheck="false"
                        >
                    </label>
                    <label class="field-right-ref">
                        Right ref
                        <input
                            id="rightRefInput"
                            name="rightRef"
                            type="text"
                            value=""
                            placeholder="feature / origin/feature / abc1234"
                            spellcheck="false"
                        >
                    </label>
                </div>
            </form>
            <p class="status" id="statusText">Loading diff…</p>
            <details class="direct-files-panel" id="directFilesPanel">
                <summary>Direct file diff</summary>
                <form class="direct-files-form" id="directFilesForm">
                    <label class="field-left-file">
                        Left file
                        <input id="leftFileInput" name="left_file" type="text" spellcheck="false" placeholder="/tmp/old.txt">
                    </label>
                    <label class="field-right-file">
                        Right file
                        <input id="rightFileInput" name="right_file" type="text" spellcheck="false" placeholder="/tmp/new.txt">
                        <span class="field-hint">When either file is filled, direct file diff overrides the repo view above.</span>
                    </label>
                </form>
            </details>
        </section>

        <section class="result-panel" id="resultPanel"></section>

        <div class="hunk-nav">
            <button type="button" id="prevHunkBtn" title="Previous hunk (Shift+N)">&#8593; Prev hunk</button>
            <button type="button" id="nextHunkBtn" title="Next hunk (N)">&#8595; Next hunk</button>
        </div>
    </main>

    <script>
        window.FILE_DIFF_DEFAULTS = __DEFAULTS_JSON__;
    </script>
    <script src="/static/hunk_nav.js"></script>
    <script src="/static/row_sync.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
