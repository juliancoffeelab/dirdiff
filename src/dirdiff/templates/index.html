<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dirdiff</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css?v=__ASSET_VERSION__">
</head>
<body>
    <main class="page-shell">
        <header class="page-header">
            <div>
                <div class="eyebrow-row">
                    <p class="eyebrow">Standalone Tool</p>
                    <div class="debug-menu" id="debugMenu">
                        <button
                            type="button"
                            class="debug-menu-toggle"
                            id="debugMenuToggle"
                            aria-haspopup="dialog"
                            aria-expanded="false"
                            aria-controls="debugMenuPanel"
                            title="Debug settings"
                        >
                            Dev
                        </button>
                        <div class="debug-menu-panel" id="debugMenuPanel" hidden>
                            <div class="debug-menu-header">
                                <strong>Developer Controls</strong>
                            </div>
                            <label class="debug-menu-field debug-menu-checkbox">
                                <input type="checkbox" id="debugScrollToggle">
                                <span>Scroll debug log</span>
                            </label>
                            <div class="debug-menu-metrics">
                                <div class="debug-metric">
                                    <span class="debug-metric-label">FPS</span>
                                    <strong class="debug-metric-value" id="debugFpsValue">--</strong>
                                </div>
                                <div class="debug-metric">
                                    <span class="debug-metric-label">Nodes</span>
                                    <strong class="debug-metric-value" id="debugNodeCountValue">--</strong>
                                </div>
                                <div class="debug-metric">
                                    <span class="debug-metric-label">Spans</span>
                                    <strong class="debug-metric-value" id="debugSpanCountValue">--</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <h1>dirdiff</h1>
                <p class="subtitle">
                    Review Git changes side by side across branches, refs, and working tree states.
                </p>
            </div>
            <div class="summary-card">
                <div class="summary-grid" id="summaryGrid"></div>
            </div>
        </header>

        <section class="controls">
            <form id="controlsForm">
                <label class="field-mode">
                    View
                    <div class="mode-button-row" id="modeButtonRow" role="tablist" aria-label="Diff views">
                        <button type="button" class="mode-button" data-mode="files">Diff files</button>
                        <button type="button" class="mode-button" data-mode="staged">Diff staged</button>
                        <button type="button" class="mode-button" data-mode="against-head">Diff against HEAD</button>
                        <button type="button" class="mode-button" data-mode="refs">Compare refs</button>
                        <button type="button" class="mode-button" data-mode="branch-review">Branch review</button>
                    </div>
                    <input id="modeInput" name="mode" type="hidden" value="files">
                    <span class="field-hint" id="modeHint">Branch review shows changes on one branch since it split from your base branch.</span>
                </label>
                <div class="branch-review-fields" id="branchReviewGroup" hidden>
                    <label class="field-base-remote">
                        Base remote
                        <input
                            id="baseRemoteInput"
                            name="baseRemote"
                            type="text"
                            value=""
                            placeholder="origin"
                            spellcheck="false"
                            autocomplete="off"
                        >
                    </label>
                    <label class="field-base-branch">
                        Base branch
                        <input
                            id="baseBranchInput"
                            name="baseBranch"
                            type="text"
                            value=""
                            placeholder="main"
                            spellcheck="false"
                            autocomplete="off"
                        >
                    </label>
                    <label class="field-branch-remote">
                        Branch remote
                        <input
                            id="branchRemoteInput"
                            name="branchRemote"
                            type="text"
                            value=""
                            placeholder="origin"
                            spellcheck="false"
                            autocomplete="off"
                        >
                    </label>
                    <label class="field-branch">
                        Branch to review
                        <input
                            id="branchInput"
                            name="reviewBranch"
                            type="text"
                            value=""
                            placeholder="feature/my-change"
                            spellcheck="false"
                            autocomplete="off"
                        >
                    </label>
                </div>
                <div class="custom-refs" id="customRefsGroup" hidden>
                    <label class="field-left-ref">
                        Left ref
                        <input
                            id="leftRefInput"
                            name="leftRef"
                            type="text"
                            value=""
                            placeholder="main / origin/main / HEAD~1"
                            spellcheck="false"
                            autocomplete="off"
                        >
                    </label>
                    <label class="field-right-ref">
                        Right ref
                        <input
                            id="rightRefInput"
                            name="rightRef"
                            type="text"
                            value=""
                            placeholder="feature / origin/feature / abc1234"
                            spellcheck="false"
                            autocomplete="off"
                        >
                    </label>
                </div>
            </form>
            <p class="status" id="statusText">Loading diff…</p>
        </section>

        <section class="result-panel" id="resultPanel"></section>
        <nav class="hunk-nav" aria-label="Hunk navigation">
            <button type="button" id="nextHunkBtn" title="Next hunk (n)">
                Next <kbd>n</kbd>
            </button>
            <button type="button" id="prevHunkBtn" title="Previous hunk (N)">
                Prev <kbd>N</kbd>
            </button>
            <button type="button" id="topHunkBtn" title="Scroll to top (p)">
                Top <kbd>p</kbd>
            </button>
        </nav>
    </main>

    <script>
        window.FILE_DIFF_DEFAULTS = __DEFAULTS_JSON__;
    </script>
    <script src="/static/folds.js?v=__ASSET_VERSION__"></script>
    <script src="/static/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
