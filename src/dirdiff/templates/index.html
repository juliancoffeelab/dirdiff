<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dirdiff</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="page-shell">
        <header class="page-header">
            <div>
                <p class="eyebrow">Standalone Tool</p>
                <h1>dirdiff</h1>
                <p class="subtitle">
                    Compare generic UTF-8 text files across Git sides or directly by path.
                </p>
            </div>
            <div class="summary-card">
                <div class="summary-grid" id="summaryGrid"></div>
            </div>
        </header>

        <section class="controls">
            <form id="controlsForm">
                <label class="wide-field">
                    Repo path
                    <input id="pathInput" name="path" type="text" spellcheck="false" placeholder="src/app.py">
                    <span class="field-hint">Leave this empty to diff the whole repo.</span>
                </label>
                <label>
                    Left side
                    <select id="leftSelect" name="left">
                        <option value="head">head</option>
                        <option value="index">index</option>
                        <option value="worktree">worktree</option>
                        <option value="__ref__">custom ref</option>
                    </select>
                    <input
                        id="leftRefInput"
                        name="leftRef"
                        type="text"
                        value=""
                        placeholder="main / origin/main / HEAD~1"
                        spellcheck="false"
                        hidden
                    >
                </label>
                <label>
                    Right side
                    <select id="rightSelect" name="right">
                        <option value="head">head</option>
                        <option value="index">index</option>
                        <option value="worktree">worktree</option>
                        <option value="__ref__">custom ref</option>
                    </select>
                    <input
                        id="rightRefInput"
                        name="rightRef"
                        type="text"
                        value=""
                        placeholder="main / origin/main / HEAD~1"
                        spellcheck="false"
                        hidden
                    >
                </label>
                <label class="wide-field">
                    Left file
                    <input id="leftFileInput" name="left_file" type="text" spellcheck="false" placeholder="/tmp/old.txt">
                </label>
                <label class="wide-field">
                    Right file
                    <input id="rightFileInput" name="right_file" type="text" spellcheck="false" placeholder="/tmp/new.txt">
                    <span class="field-hint">Leave Repo path empty to diff these directly.</span>
                </label>
                <button type="submit">Load diff</button>
            </form>
            <p class="status" id="statusText">Loading diff…</p>
        </section>

        <section class="result-panel" id="resultPanel"></section>

        <div class="hunk-nav">
            <button type="button" id="prevHunkBtn" title="Previous hunk (Shift+N)">&#8593; Prev hunk</button>
            <button type="button" id="nextHunkBtn" title="Next hunk (N)">&#8595; Next hunk</button>
        </div>
    </main>

    <script>
        window.FILE_DIFF_DEFAULTS = __DEFAULTS_JSON__;
    </script>
    <script src="/static/hunk_nav.js"></script>
    <script src="/static/row_sync.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
